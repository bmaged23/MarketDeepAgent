<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartCart Database Schema</title>
<style>
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #FAFAF8;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 22px; color: #2B2420; margin-bottom: 4px; }
  p.sub { color: #777; font-size: 14px; margin-top: 0; margin-bottom: 30px; }
  .diagram-wrap {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-width: 100%;
    overflow-x: auto;
  }
</style>
</head>
<body>

<h1>SmartCart Database Schema</h1>
<p class="sub">7 tables · category, product, person, order_status, orders, order_items</p>

<div class="diagram-wrap" id="diagram"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  themeVariables: {
    fontSize: '13px',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    primaryColor: '#F2E0C4',
    primaryBorderColor: '#8B7FB8',
    primaryTextColor: '#3d3d3a',
    secondaryColor: '#F0EDF9',
    tertiaryColor: '#F0EDF9',
    attributeBackgroundColorOdd: '#FFFFFF',
    attributeBackgroundColorEven: '#F0EDF9',
  },
});
const src = `erDiagram
  PERSON ||--o{ ORDERS : places
  ORDER_STATUS ||--o{ ORDERS : has_status
  ORDERS ||--o{ ORDER_ITEMS : contains
  PRODUCT ||--o{ ORDER_ITEMS : included_in
  CATEGORY ||--o{ PRODUCT : groups

  PERSON {
    int person_id PK
    string first_name
    string last_name
    string email "UNIQUE"
    string password_hash
    string phone
    string address
    timestamp created_at
  }
  ORDER_STATUS {
    int status_id PK
    string label "UNIQUE"
  }
  ORDERS {
    int order_id PK
    int person_id FK
    int status_id FK
    timestamp order_date
    decimal total_amount "CHECK >= 0"
    timestamp created_at
    timestamp updated_at
  }
  ORDER_ITEMS {
    int order_item_id PK
    int order_id FK
    int product_id FK
    int quantity "CHECK > 0"
    decimal unit_price "CHECK >= 0"
  }
  CATEGORY {
    int category_id PK
    string name "UNIQUE"
  }
  PRODUCT {
    int product_id PK
    string name
    string description
    decimal price "CHECK >= 0"
    int stock_quantity "CHECK >= 0"
    int category_id FK
    string image_prompt
    string image_path
    decimal avg_rating "3-5"
    string review "2-line text"
    timestamp created_at
    timestamp updated_at
  }`;
const { svg } = await mermaid.render('schema-svg', src);
document.getElementById('diagram').innerHTML = svg;
</script>

</body>
</html>
