<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="heading desc"><title id="heading">04 / Private memory across conversations</title><desc id="desc">Conversation history lives in SQL. Optional long-term preferences have a separate derived vector index.. Arrowheads show call, return and write directions. Motion is illustrative.</desc><defs><marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker><marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c4b5fd" stroke-width="2"/></marker><marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fbbf24" stroke-width="2"/></marker><marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5eead4" stroke-width="2"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#060e1c"/></linearGradient></defs><style>
text{font-family:system-ui,-apple-system,Arial,sans-serif}.heading{fill:#f0f6ff;font-size:30px;font-weight:700}.muted{fill:#94a9c4;font-size:13px}.lane{fill:#102039;fill-opacity:.55;stroke:#263d5b}.lane-title{fill:#d6e6fa;font-size:15px;font-weight:600;letter-spacing:1px}.card{fill:#14253d;stroke:#3a5575}.title{fill:#f0f6ff;font-size:19px;font-weight:650}.body{fill:#b4c6dd;font-size:13px}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px}.node:hover .card,.node:focus .card{stroke:#e2e8f0;stroke-width:2}.flow{fill:none;stroke-width:2;stroke-linejoin:round}.response .flow{stroke-dasharray:6 5}.sync .flow{stroke-dasharray:3 5}.edge-label{font-size:12px}@media(prefers-reduced-motion:reduce){.signal{display:none}}
</style><rect width="1400" height="1040" fill="url(#bg)"/><text class="heading" x="40" y="48">04 / Private memory across conversations</text><text class="muted" x="40" y="76">Conversation history lives in SQL. Optional long-term preferences have a separate derived vector index.</text><rect class="lane" x="24" y="105" width="1352" height="211" rx="22"/><text class="lane-title" x="48" y="136">RECALL</text><text class="muted" x="48" y="158">The authenticated person_id scopes recall. Vectors alone are never trusted to establish ownership or freshness.</text><rect class="lane" x="24" y="405" width="1352" height="211" rx="22"/><text class="lane-title" x="48" y="436">VERIFY + RESPOND</text><text class="muted" x="48" y="458">A SQL recheck removes deleted, changed, foreign-owner and inactive facts before they enter the prompt.</text><rect class="lane" x="24" y="715" width="1352" height="233" rx="22"/><text class="lane-title" x="48" y="746">SAVE / EDIT / DELETE</text><text class="muted" x="48" y="768">Approved explicit preferences are stored in SQL first. Queued synchronization is separate from product indexing.</text><g class="connection request" data-from="chat" data-to="query" data-kind="request"><title>recall request: chat → query</title><path class="flow" d="M 385 240 L 535 240" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 385 240 L 535 240"/></circle></g><g class="connection sync" data-from="query" data-to="vectors" data-kind="sync"><title>filtered vector query: query → vectors</title><path class="flow" d="M 870 240 L 1020 240" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 870 240 L 1020 240"/></circle></g><g class="connection response" data-from="vectors" data-to="sql" data-kind="response"><title>candidate IDs / versions: vectors → sql</title><path class="flow" d="M 1187.5 300 L 1187.5 480" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 1187.5 300 L 1187.5 480"/></circle></g><g class="connection response" data-from="sql" data-to="context" data-kind="response"><title>verified facts + history: sql → context</title><path class="flow" d="M 1020 540 L 870 540" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 1020 540 L 870 540"/></circle></g><g class="connection request" data-from="context" data-to="customer" data-kind="request"><title>bounded prompt: context → customer</title><path class="flow" d="M 535 540 L 385 540" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 535 540 L 385 540"/></circle></g><g class="connection write" data-from="facts" data-to="save" data-kind="write"><title>validated preference: facts → save</title><path class="flow" d="M 385 859 L 535 859" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 385 859 L 535 859"/></circle></g><g class="connection sync" data-from="save" data-to="sync" data-kind="sync"><title>durable job: save → sync</title><path class="flow" d="M 870 859 L 1020 859" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 870 859 L 1020 859"/></circle></g><g class="connection sync" data-from="sync" data-to="vectors" data-kind="sync"><title>upsert / delete vectors: sync → vectors</title><path class="flow" d="M 1355 859 L 1388 859 L 1388 96 L 1187.5 96 L 1187.5 180" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 1355 859 L 1388 859 L 1388 96 L 1187.5 96 L 1187.5 180"/></circle></g><g class="node" tabindex="0" role="button" aria-label="Authenticated chat" data-detail="Current page + request + history Memory enabled by customer preference"><title>Current page + request + history Memory enabled by customer preference</title><rect class="card" x="50" y="180" width="335" height="120" rx="15"/><rect x="68" y="198" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="210" fill="#7dd3fc">CUSTOMER CONTEXT</text><text class="title" x="68" y="238">Authenticated chat</text><text class="body" x="68" y="262">Current page + request + history</text><text class="body" x="68" y="280">Memory enabled by customer preference</text></g><g class="node" tabindex="0" role="button" aria-label="BGE → memory recall" data-detail="Embed request · owner filter Owner + model filter · SQL recheck"><title>Embed request · owner filter Owner + model filter · SQL recheck</title><rect class="card" x="535" y="180" width="335" height="120" rx="15"/><rect x="553" y="198" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="565" y="210" fill="#5eead4">SEMANTIC RECALL</text><text class="title" x="553" y="238">BGE → memory recall</text><text class="body" x="553" y="262">Embed request · owner filter</text><text class="body" x="553" y="280">Owner + model filter · SQL recheck</text></g><g class="node" tabindex="0" role="button" aria-label="Qdrant memory collection" data-detail="customer_memories only memory_id / person_id / version"><title>customer_memories only memory_id / person_id / version</title><rect class="card" x="1020" y="180" width="335" height="120" rx="15"/><rect x="1038" y="198" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="1050" y="210" fill="#5eead4">DERIVED INDEX</text><text class="title" x="1038" y="238">Qdrant memory collection</text><text class="body" x="1038" y="262">customer_memories only</text><text class="body" x="1038" y="280">memory_id / person_id / version</text></g><g class="node" tabindex="0" role="button" aria-label="Authoritative SQL recheck" data-detail="Owner · active · current version Chat history stored independently"><title>Owner · active · current version Chat history stored independently</title><rect class="card" x="1020" y="480" width="335" height="120" rx="15"/><rect x="1038" y="498" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="1050" y="510" fill="#fbbf24">SQL GUARD</text><text class="title" x="1038" y="538">Authoritative SQL recheck</text><text class="body" x="1038" y="562">Owner · active · current version</text><text class="body" x="1038" y="580">Chat history stored independently</text></g><g class="node" tabindex="0" role="button" aria-label="Verified customer context" data-detail="Bounded history + approved memory Page registry + available operations"><title>Bounded history + approved memory Page registry + available operations</title><rect class="card" x="535" y="480" width="335" height="120" rx="15"/><rect x="553" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="565" y="510" fill="#7dd3fc">PROMPT CONTEXT</text><text class="title" x="553" y="538">Verified customer context</text><text class="body" x="553" y="562">Bounded history + approved memory</text><text class="body" x="553" y="580">Page registry + available operations</text></g><g class="node" tabindex="0" role="button" aria-label="Customer coordinator" data-detail="Plan with verified preferences Grounded reply + typed UI actions"><title>Plan with verified preferences Grounded reply + typed UI actions</title><rect class="card" x="50" y="480" width="335" height="120" rx="15"/><rect x="68" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="510" fill="#7dd3fc">OLLAMA</text><text class="title" x="68" y="538">Customer coordinator</text><text class="body" x="68" y="562">Plan with verified preferences</text><text class="body" x="68" y="580">Grounded reply + typed UI actions</text></g><g class="node" tabindex="0" role="button" aria-label="Approved preference changes" data-detail="Explicit facts / customer settings Disable or delete memory controls"><title>Explicit facts / customer settings Disable or delete memory controls</title><rect class="card" x="50" y="799" width="335" height="120" rx="15"/><rect x="68" y="817" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="829" fill="#7dd3fc">CUSTOMER-OWNED</text><text class="title" x="68" y="857">Approved preference changes</text><text class="body" x="68" y="881">Explicit facts / customer settings</text><text class="body" x="68" y="899">Disable or delete memory controls</text></g><g class="node" tabindex="0" role="button" aria-label="SQL facts + sync queue" data-detail="Save / version / revoke immediately Retries without trusting stale vectors"><title>Save / version / revoke immediately Retries without trusting stale vectors</title><rect class="card" x="535" y="799" width="335" height="120" rx="15"/><rect x="553" y="817" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="565" y="829" fill="#fbbf24">AUTHORITATIVE WRITE</text><text class="title" x="553" y="857">SQL facts + sync queue</text><text class="body" x="553" y="881">Save / version / revoke immediately</text><text class="body" x="553" y="899">Retries without trusting stale vectors</text></g><g class="node" tabindex="0" role="button" aria-label="BGE + memory sync" data-detail="Encode current memory document Upsert / delete customer_memories"><title>Encode current memory document Upsert / delete customer_memories</title><rect class="card" x="1020" y="799" width="335" height="120" rx="15"/><rect x="1038" y="817" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="1050" y="829" fill="#5eead4">DERIVED WRITE</text><text class="title" x="1038" y="857">BGE + memory sync</text><text class="body" x="1038" y="881">Encode current memory document</text><text class="body" x="1038" y="899">Upsert / delete customer_memories</text></g><g><rect x="402.0" y="223" width="116" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="239" text-anchor="middle" fill="#7dd3fc">recall request</text></g><g><rect x="862.5" y="223" width="165" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="239" text-anchor="middle" fill="#5eead4">filtered vector query</text></g><g><rect x="1094.0" y="353" width="186" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1187" y="369" text-anchor="middle" fill="#c4b5fd">candidate IDs / versions</text></g><g><rect x="852.0" y="524" width="186" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="540" text-anchor="middle" fill="#c4b5fd">verified facts + history</text></g><g><rect x="402.0" y="524" width="116" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="540" text-anchor="middle" fill="#7dd3fc">bounded prompt</text></g><g><rect x="381.0" y="846" width="158" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="862" text-anchor="middle" fill="#fbbf24">validated preference</text></g><g><rect x="897.5" y="846" width="95" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="862" text-anchor="middle" fill="#5eead4">durable job</text></g><g><rect x="1140.5" y="83" width="179" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1230" y="99" text-anchor="middle" fill="#5eead4">upsert / delete vectors</text></g><text class="muted" x="40" y="1016">SOURCE-BACKED ARCHITECTURE  /  Motion illustrates direction; it is not runtime telemetry.</text></svg>