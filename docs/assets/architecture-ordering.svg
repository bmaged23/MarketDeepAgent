<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="heading desc"><title id="heading">03 / From a shopping request to a real order</title><desc id="desc">Cart changes use customer-bound tools. Checkout confirmation comes from the customer’s actual form.. Arrowheads show call, return and write directions. Motion is illustrative.</desc><defs><marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker><marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c4b5fd" stroke-width="2"/></marker><marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fbbf24" stroke-width="2"/></marker><marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5eead4" stroke-width="2"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#060e1c"/></linearGradient></defs><style>
text{font-family:system-ui,-apple-system,Arial,sans-serif}.heading{fill:#f0f6ff;font-size:30px;font-weight:700}.muted{fill:#94a9c4;font-size:13px}.lane{fill:#102039;fill-opacity:.55;stroke:#263d5b}.lane-title{fill:#d6e6fa;font-size:15px;font-weight:600;letter-spacing:1px}.card{fill:#14253d;stroke:#3a5575}.title{fill:#f0f6ff;font-size:19px;font-weight:650}.body{fill:#b4c6dd;font-size:13px}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px}.node:hover .card,.node:focus .card{stroke:#e2e8f0;stroke-width:2}.flow{fill:none;stroke-width:2;stroke-linejoin:round}.response .flow{stroke-dasharray:6 5}.sync .flow{stroke-dasharray:3 5}.edge-label{font-size:12px}@media(prefers-reduced-motion:reduce){.signal{display:none}}
</style><rect width="1400" height="1100" fill="url(#bg)"/><text class="heading" x="40" y="48">03 / From a shopping request to a real order</text><text class="muted" x="40" y="76">Cart changes use customer-bound tools. Checkout confirmation comes from the customer’s actual form.</text><rect class="lane" x="24" y="105" width="1352" height="220" rx="22"/><text class="lane-title" x="48" y="136">AGENT-ASSISTED SHOPPING</text><text class="muted" x="48" y="158">The coordinator supplies approved product evidence and history to the cart specialist.</text><rect class="lane" x="24" y="404" width="1352" height="221" rx="22"/><text class="lane-title" x="48" y="435">QUOTE + EXPLICIT CONFIRMATION</text><text class="muted" x="48" y="457">The model can prepare a quote. It cannot supply the trusted customer confirmation.</text><rect class="lane" x="24" y="712" width="1352" height="222" rx="22"/><text class="lane-title" x="48" y="743">ATOMIC ORDER + RECEIPT</text><text class="muted" x="48" y="765">Cash on delivery remains unpaid. Pending means awaiting fulfillment; carrier/payment integrations are not connected.</text><g class="connection request" data-from="customer" data-to="cart" data-kind="request"><title>shopping intent: customer → cart</title><path class="flow" d="M 385 230 L 535 230" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 385 230 L 535 230"/></circle></g><g class="connection write" data-from="cart" data-to="sql" data-kind="write"><title>validated operation: cart → sql</title><path class="flow" d="M 870 230 L 1020 230" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 870 230 L 1020 230"/></circle></g><g class="connection response" data-from="sql" data-to="cart" data-kind="response"><title>validated state: sql → cart</title><path class="flow" d="M 1020 275 L 870 275" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 1020 275 L 870 275"/></circle></g><g class="connection response" data-from="cart" data-to="customer" data-kind="response"><title>tool results / quote: cart → customer</title><path class="flow" d="M 535 275 L 385 275" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 535 275 L 385 275"/></circle></g><g class="connection request" data-from="sql" data-to="quote" data-kind="request"><title>prepare quote: sql → quote</title><path class="flow" d="M 1187.5 310 L 1187.5 480" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 1187.5 310 L 1187.5 480"/></circle></g><g class="connection response" data-from="quote" data-to="form" data-kind="response"><title>quoted items + total: quote → form</title><path class="flow" d="M 1020 540 L 870 540" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 1020 540 L 870 540"/></circle></g><g class="connection write" data-from="form" data-to="checkout" data-kind="write"><title>confirmed form: form → checkout</title><path class="flow" d="M 535 540 L 385 540" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 535 540 L 385 540"/></circle></g><g class="connection write" data-from="checkout" data-to="transaction" data-kind="write"><title>commit validated order: checkout → transaction</title><path class="flow" d="M 217.5 600 L 217.5 790" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 217.5 600 L 217.5 790"/></circle></g><g class="connection response" data-from="transaction" data-to="receipt" data-kind="response"><title>committed result: transaction → receipt</title><path class="flow" d="M 385 850 L 535 850" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 385 850 L 535 850"/></circle></g><g class="connection response" data-from="receipt" data-to="browser" data-kind="response"><title>receipt + cart refresh: receipt → browser</title><path class="flow" d="M 870 850 L 1020 850" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M 870 850 L 1020 850"/></circle></g><g class="connection request" data-from="browser" data-to="customer" data-kind="request"><title>next chat carries fresh cart / order context: browser → customer</title><path class="flow" d="M 1187.5 910 L 1187.5 1015 L 12 1015 L 12 250 L 50 250" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 1187.5 910 L 1187.5 1015 L 12 1015 L 12 250 L 50 250"/></circle></g><g class="node" tabindex="0" role="button" aria-label="Customer coordinator" data-detail="Request + product references Customer identity bound by application"><title>Request + product references Customer identity bound by application</title><rect class="card" x="50" y="190" width="335" height="120" rx="15"/><rect x="68" y="208" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="220" fill="#7dd3fc">ORCHESTRATION</text><text class="title" x="68" y="248">Customer coordinator</text><text class="body" x="68" y="272">Request + product references</text><text class="body" x="68" y="290">Customer identity bound by application</text></g><g class="node" tabindex="0" role="button" aria-label="Cart agent + tools" data-detail="Resolve / add / change / remove Inspect cart · order history · reviews"><title>Resolve / add / change / remove Inspect cart · order history · reviews</title><rect class="card" x="535" y="190" width="335" height="120" rx="15"/><rect x="553" y="208" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="565" y="220" fill="#fbbf24">VALIDATED TOOL CALLS</text><text class="title" x="553" y="248">Cart agent + tools</text><text class="body" x="553" y="272">Resolve / add / change / remove</text><text class="body" x="553" y="290">Inspect cart · order history · reviews</text></g><g class="node" tabindex="0" role="button" aria-label="SQL cart service" data-detail="Check product, quantity, stock, price Shared cart revision + dollar totals"><title>Check product, quantity, stock, price Shared cart revision + dollar totals</title><rect class="card" x="1020" y="190" width="335" height="120" rx="15"/><rect x="1038" y="208" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="1050" y="220" fill="#fbbf24">CUSTOMER-SCOPED STATE</text><text class="title" x="1038" y="248">SQL cart service</text><text class="body" x="1038" y="272">Check product, quantity, stock, price</text><text class="body" x="1038" y="290">Shared cart revision + dollar totals</text></g><g class="node" tabindex="0" role="button" aria-label="Checkout quote" data-detail="Snapshot + expiry + opaque token Changed stock / price → quote again"><title>Snapshot + expiry + opaque token Changed stock / price → quote again</title><rect class="card" x="1020" y="480" width="335" height="120" rx="15"/><rect x="1038" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="1050" y="510" fill="#7dd3fc">PREPARE</text><text class="title" x="1038" y="538">Checkout quote</text><text class="body" x="1038" y="562">Snapshot + expiry + opaque token</text><text class="body" x="1038" y="580">Changed stock / price → quote again</text></g><g class="node" tabindex="0" role="button" aria-label="Browser confirmation form" data-detail="Delivery address + COD choice Customer explicitly confirms order"><title>Delivery address + COD choice Customer explicitly confirms order</title><rect class="card" x="535" y="480" width="335" height="120" rx="15"/><rect x="553" y="498" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="565" y="510" fill="#fbbf24">CUSTOMER ACTION</text><text class="title" x="553" y="538">Browser confirmation form</text><text class="body" x="553" y="562">Delivery address + COD choice</text><text class="body" x="553" y="580">Customer explicitly confirms order</text></g><g class="node" tabindex="0" role="button" aria-label="Confirmed checkout API" data-detail="Session + CSRF + quote ownership Validate snapshot and confirmation"><title>Session + CSRF + quote ownership Validate snapshot and confirmation</title><rect class="card" x="50" y="480" width="335" height="120" rx="15"/><rect x="68" y="498" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="80" y="510" fill="#fbbf24">TRUSTED APPLICATION</text><text class="title" x="68" y="538">Confirmed checkout API</text><text class="body" x="68" y="562">Session + CSRF + quote ownership</text><text class="body" x="68" y="580">Validate snapshot and confirmation</text></g><g class="node" tabindex="0" role="button" aria-label="SQLite transaction" data-detail="Insert order + deduct stock once Clear cart · bind quote to order"><title>Insert order + deduct stock once Clear cart · bind quote to order</title><rect class="card" x="50" y="790" width="335" height="120" rx="15"/><rect x="68" y="808" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="80" y="820" fill="#fbbf24">ATOMIC / IDEMPOTENT</text><text class="title" x="68" y="848">SQLite transaction</text><text class="body" x="68" y="872">Insert order + deduct stock once</text><text class="body" x="68" y="890">Clear cart · bind quote to order</text></g><g class="node" tabindex="0" role="button" aria-label="Order + updated cart" data-detail="Receipt + purchased line items Repeated token → same order"><title>Receipt + purchased line items Repeated token → same order</title><rect class="card" x="535" y="790" width="335" height="120" rx="15"/><rect x="553" y="808" width="3" height="15" rx="1" fill="#c4b5fd"/><text class="tag" x="565" y="820" fill="#c4b5fd">API RESPONSE</text><text class="title" x="553" y="848">Order + updated cart</text><text class="body" x="553" y="872">Receipt + purchased line items</text><text class="body" x="553" y="890">Repeated token → same order</text></g><g class="node" tabindex="0" role="button" aria-label="Storefront + order history" data-detail="Render receipt · refresh shared cart Owned orders / shipping / reviews"><title>Render receipt · refresh shared cart Owned orders / shipping / reviews</title><rect class="card" x="1020" y="790" width="335" height="120" rx="15"/><rect x="1038" y="808" width="3" height="15" rx="1" fill="#c4b5fd"/><text class="tag" x="1050" y="820" fill="#c4b5fd">CUSTOMER EXPERIENCE</text><text class="title" x="1038" y="848">Storefront + order history</text><text class="body" x="1038" y="872">Render receipt · refresh shared cart</text><text class="body" x="1038" y="890">Owned orders / shipping / reviews</text></g><g><rect x="398.5" y="212" width="123" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="228" text-anchor="middle" fill="#7dd3fc">shopping intent</text></g><g><rect x="869.5" y="212" width="151" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="228" text-anchor="middle" fill="#fbbf24">validated operation</text></g><g><rect x="883.5" y="272" width="123" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="288" text-anchor="middle" fill="#c4b5fd">validated state</text></g><g><rect x="381.0" y="272" width="158" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="288" text-anchor="middle" fill="#c4b5fd">tool results / quote</text></g><g><rect x="1130.5" y="355" width="109" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1185" y="371" text-anchor="middle" fill="#7dd3fc">prepare quote</text></g><g><rect x="866.0" y="527" width="158" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="543" text-anchor="middle" fill="#c4b5fd">quoted items + total</text></g><g><rect x="402.0" y="527" width="116" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="543" text-anchor="middle" fill="#fbbf24">confirmed form</text></g><g><rect x="131.0" y="664" width="172" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="217" y="680" text-anchor="middle" fill="#fbbf24">commit validated order</text></g><g><rect x="395.0" y="835" width="130" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="851" text-anchor="middle" fill="#c4b5fd">committed result</text></g><g><rect x="859.0" y="835" width="172" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="851" text-anchor="middle" fill="#c4b5fd">receipt + cart refresh</text></g><g><rect x="557.0" y="1002" width="326" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="720" y="1018" text-anchor="middle" fill="#7dd3fc">next chat carries fresh cart / order context</text></g><text class="muted" x="40" y="1076">SOURCE-BACKED ARCHITECTURE  /  Motion illustrates direction; it is not runtime telemetry.</text></svg>