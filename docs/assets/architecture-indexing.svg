<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="heading desc"><title id="heading">05 / One catalog, two search indexes</title><desc id="desc">SQL product_id and category_id are shared with the product vector payload. New products begin in SQL.. Arrowheads show call, return and write directions. Motion is illustrative.</desc><defs><marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker><marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c4b5fd" stroke-width="2"/></marker><marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fbbf24" stroke-width="2"/></marker><marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5eead4" stroke-width="2"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#060e1c"/></linearGradient></defs><style>
text{font-family:system-ui,-apple-system,Arial,sans-serif}.heading{fill:#f0f6ff;font-size:30px;font-weight:700}.muted{fill:#94a9c4;font-size:13px}.lane{fill:#102039;fill-opacity:.55;stroke:#263d5b}.lane-title{fill:#d6e6fa;font-size:15px;font-weight:600;letter-spacing:1px}.card{fill:#14253d;stroke:#3a5575}.title{fill:#f0f6ff;font-size:19px;font-weight:650}.body{fill:#b4c6dd;font-size:13px}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px}.node:hover .card,.node:focus .card{stroke:#e2e8f0;stroke-width:2}.flow{fill:none;stroke-width:2;stroke-linejoin:round}.response .flow{stroke-dasharray:6 5}.sync .flow{stroke-dasharray:3 5}.edge-label{font-size:12px}@media(prefers-reduced-motion:reduce){.signal{display:none}}
</style><rect width="1400" height="1000" fill="url(#bg)"/><text class="heading" x="40" y="48">05 / One catalog, two search indexes</text><text class="muted" x="40" y="76">SQL product_id and category_id are shared with the product vector payload. New products begin in SQL.</text><rect class="lane" x="24" y="105" width="1352" height="221" rx="22"/><text class="lane-title" x="48" y="136">CATALOG WRITE</text><text class="muted" x="48" y="158">Seed / import / product changes go through SQL. Prices, stock and nutrition are authoritative here.</text><rect class="lane" x="24" y="405" width="1352" height="220" rx="22"/><text class="lane-title" x="48" y="436">DURABLE PRODUCT INDEXING</text><text class="muted" x="48" y="458">The indexing command processes queued jobs; failures retry and reconciliation repairs stale / orphan vectors.</text><rect class="lane" x="24" y="727" width="1352" height="199" rx="22"/><text class="lane-title" x="48" y="758">VECTOR WRITE + QUERY CONSISTENCY</text><text class="muted" x="48" y="780">Search hydrates current SQL facts; stale prices and stock are never taken as authoritative from vector payloads.</text><g class="connection write"><title>catalog transaction: input → sql</title><path class="flow" d="M 385 250 L 535 250" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 385 250 L 535 250"/></circle></g><g class="connection write"><title>SQL triggers: sql → fts</title><path class="flow" d="M 870 250 L 1020 250" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 870 250 L 1020 250"/></circle></g><g class="connection sync"><title>enqueue product revision: sql → jobs</title><path class="flow" d="M 702.5 310 L 702.5 480" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 702.5 310 L 702.5 480"/></circle></g><g class="connection request"><title>load current document: jobs → document</title><path class="flow" d="M 535 540 L 385 540" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 535 540 L 385 540"/></circle></g><g class="connection sync"><title>encode product text: document → bge</title><path class="flow" d="M 217.5 600 L 217.5 664 L 990 664 L 990 540 L 1020 540" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 217.5 600 L 217.5 664 L 990 664 L 990 540 L 1020 540"/></circle></g><g class="connection sync"><title>upsert / delete point: bge → vectors</title><path class="flow" d="M 1187.5 600 L 1187.5 793" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1187.5 600 L 1187.5 793"/></circle></g><g class="connection response"><title>operation result: vectors → status</title><path class="flow" d="M 1020 853 L 870 853" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1020 853 L 870 853"/></circle></g><g class="connection request"><title>embedded query: query → vectors</title><path class="flow" d="M 217.5 913 L 217.5 952 L 1187.5 952 L 1187.5 913" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 217.5 913 L 217.5 952 L 1187.5 952 L 1187.5 913"/></circle></g><g class="node" tabindex="0" role="button" aria-label="Catalog input" data-detail="Product details + image references Create / update / delete"><title>Product details + image references Create / update / delete</title><rect class="card" x="50" y="190" width="335" height="120" rx="15"/><rect x="68" y="208" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="220" fill="#7dd3fc">PRODUCT DATA</text><text class="title" x="68" y="248">Catalog input</text><text class="body" x="68" y="272">Product details + image references</text><text class="body" x="68" y="290">Create / update / delete</text></g><g class="node" tabindex="0" role="button" aria-label="SQLite product catalog" data-detail="Stable product_id + category_id Search revision + nutrition facts"><title>Stable product_id + category_id Search revision + nutrition facts</title><rect class="card" x="535" y="190" width="335" height="120" rx="15"/><rect x="553" y="208" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="565" y="220" fill="#fbbf24">AUTHORITATIVE STORE</text><text class="title" x="553" y="248">SQLite product catalog</text><text class="body" x="553" y="272">Stable product_id + category_id</text><text class="body" x="553" y="290">Search revision + nutrition facts</text></g><g class="node" tabindex="0" role="button" aria-label="FTS5 / BM25 index" data-detail="SQL triggers maintain search text Synchronized in catalog transaction"><title>SQL triggers maintain search text Synchronized in catalog transaction</title><rect class="card" x="1020" y="190" width="335" height="120" rx="15"/><rect x="1038" y="208" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="1050" y="220" fill="#fbbf24">LEXICAL INDEX</text><text class="title" x="1038" y="248">FTS5 / BM25 index</text><text class="body" x="1038" y="272">SQL triggers maintain search text</text><text class="body" x="1038" y="290">Synchronized in catalog transaction</text></g><g class="node" tabindex="0" role="button" aria-label="product_index_jobs" data-detail="Product ID + revision + operation Pending → processing → done / failed"><title>Product ID + revision + operation Pending → processing → done / failed</title><rect class="card" x="535" y="480" width="335" height="120" rx="15"/><rect x="553" y="498" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="565" y="510" fill="#5eead4">DURABLE QUEUE</text><text class="title" x="553" y="538">product_index_jobs</text><text class="body" x="553" y="562">Product ID + revision + operation</text><text class="body" x="553" y="580">Pending → processing → done / failed</text></g><g class="node" tabindex="0" role="button" aria-label="Current product document" data-detail="Read latest SQL product fields Name / category / description / kcal"><title>Read latest SQL product fields Name / category / description / kcal</title><rect class="card" x="50" y="480" width="335" height="120" rx="15"/><rect x="68" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="510" fill="#7dd3fc">INDEXING PROCESS</text><text class="title" x="68" y="538">Current product document</text><text class="body" x="68" y="562">Read latest SQL product fields</text><text class="body" x="68" y="580">Name / category / description / kcal</text></g><g class="node" tabindex="0" role="button" aria-label="BGE embeddings" data-detail="BAAI/bge-large-en-v1.5 1024-dimensional product vectors"><title>BAAI/bge-large-en-v1.5 1024-dimensional product vectors</title><rect class="card" x="1020" y="480" width="335" height="120" rx="15"/><rect x="1038" y="498" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="1050" y="510" fill="#5eead4">LOCAL MODEL</text><text class="title" x="1038" y="538">BGE embeddings</text><text class="body" x="1038" y="562">BAAI/bge-large-en-v1.5</text><text class="body" x="1038" y="580">1024-dimensional product vectors</text></g><g class="node" tabindex="0" role="button" aria-label="Hybrid search at query time" data-detail="Query BGE + BM25 candidates Weighted ranking → fresh SQL facts"><title>Query BGE + BM25 candidates Weighted ranking → fresh SQL facts</title><rect class="card" x="50" y="793" width="335" height="120" rx="15"/><rect x="68" y="811" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="823" fill="#7dd3fc">READ PATH</text><text class="title" x="68" y="851">Hybrid search at query time</text><text class="body" x="68" y="875">Query BGE + BM25 candidates</text><text class="body" x="68" y="893">Weighted ranking → fresh SQL facts</text></g><g class="node" tabindex="0" role="button" aria-label="Qdrant market_products" data-detail="Point ID = SQL product_id Category ID / model / hash / revision"><title>Point ID = SQL product_id Category ID / model / hash / revision</title><rect class="card" x="1020" y="793" width="335" height="120" rx="15"/><rect x="1038" y="811" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="1050" y="823" fill="#5eead4">DERIVED PRODUCT INDEX</text><text class="title" x="1038" y="851">Qdrant market_products</text><text class="body" x="1038" y="875">Point ID = SQL product_id</text><text class="body" x="1038" y="893">Category ID / model / hash / revision</text></g><g class="node" tabindex="0" role="button" aria-label="Job result + reconciliation" data-detail="Mark completion / retry failures Compare revisions / remove orphans"><title>Mark completion / retry failures Compare revisions / remove orphans</title><rect class="card" x="535" y="793" width="335" height="120" rx="15"/><rect x="553" y="811" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="565" y="823" fill="#5eead4">INDEXING STATUS</text><text class="title" x="553" y="851">Job result + reconciliation</text><text class="body" x="553" y="875">Mark completion / retry failures</text><text class="body" x="553" y="893">Compare revisions / remove orphans</text></g><g><rect x="384.5" y="234" width="151" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="250" text-anchor="middle" fill="#fbbf24">catalog transaction</text></g><g><rect x="894.0" y="234" width="102" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="250" text-anchor="middle" fill="#fbbf24">SQL triggers</text></g><g><rect x="609.0" y="357" width="186" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="702" y="373" text-anchor="middle" fill="#5eead4">enqueue product revision</text></g><g><rect x="377.5" y="524" width="165" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="540" text-anchor="middle" fill="#7dd3fc">load current document</text></g><g><rect x="624.5" y="651" width="151" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="700" y="667" text-anchor="middle" fill="#5eead4">encode product text</text></g><g><rect x="1104.5" y="697" width="165" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1187" y="713" text-anchor="middle" fill="#5eead4">upsert / delete point</text></g><g><rect x="880.0" y="837" width="130" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="853" text-anchor="middle" fill="#c4b5fd">operation result</text></g><g><rect x="642.0" y="939" width="116" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="700" y="955" text-anchor="middle" fill="#7dd3fc">embedded query</text></g><text class="muted" x="40" y="976">SOURCE-BACKED ARCHITECTURE  /  Motion illustrates direction; it is not runtime telemetry.</text></svg>