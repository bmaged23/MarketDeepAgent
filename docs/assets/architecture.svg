<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="heading desc"><title id="heading">01 / The shopping system</title><desc id="desc">Three agents, one authoritative database, two separate vector collections.. Arrowheads show call, return and write directions. Motion is illustrative.</desc><defs><marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker><marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c4b5fd" stroke-width="2"/></marker><marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fbbf24" stroke-width="2"/></marker><marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5eead4" stroke-width="2"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#060e1c"/></linearGradient></defs><style>
text{font-family:system-ui,-apple-system,Arial,sans-serif}.heading{fill:#f0f6ff;font-size:30px;font-weight:700}.muted{fill:#94a9c4;font-size:13px}.lane{fill:#102039;fill-opacity:.55;stroke:#263d5b}.lane-title{fill:#d6e6fa;font-size:15px;font-weight:600;letter-spacing:1px}.card{fill:#14253d;stroke:#3a5575}.title{fill:#f0f6ff;font-size:19px;font-weight:650}.body{fill:#b4c6dd;font-size:13px}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px}.node:hover .card,.node:focus .card{stroke:#e2e8f0;stroke-width:2}.flow{fill:none;stroke-width:2;stroke-linejoin:round}.response .flow{stroke-dasharray:6 5}.sync .flow{stroke-dasharray:3 5}.edge-label{font-size:12px}@media(prefers-reduced-motion:reduce){.signal{display:none}}
</style><rect width="1400" height="1040" fill="url(#bg)"/><text class="heading" x="40" y="48">01 / The shopping system</text><text class="muted" x="40" y="76">Three agents, one authoritative database, two separate vector collections.</text><rect class="lane" x="24" y="105" width="1352" height="205" rx="22"/><text class="lane-title" x="48" y="136">CUSTOMER EXPERIENCE</text><text class="muted" x="48" y="158">The browser shares authenticated application state with the AI assistant.</text><rect class="lane" x="24" y="382" width="1352" height="229" rx="22"/><text class="lane-title" x="48" y="413">SPECIALISTS + MODEL</text><text class="muted" x="48" y="435">Every LLM role uses Ollama Cloud / gpt-oss:120b. Data access remains in validated tools.</text><rect class="lane" x="24" y="689" width="1352" height="277" rx="22"/><text class="lane-title" x="48" y="720">SHARED SERVICES + STORAGE</text><text class="muted" x="48" y="742">SQLite owns the facts; FTS and Qdrant support discovery. Inspect the detailed views for calls and return paths.</text><g class="connection request"><title>message + page context: browser → api</title><path class="flow" d="M 380 237 L 535 237" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 380 237 L 535 237"/></circle></g><g class="connection response"><title>reply + safe actions: api → browser</title><path class="flow" d="M 535 266 L 380 266" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 535 266 L 380 266"/></circle></g><g class="connection request"><title>bound request: api → customer</title><path class="flow" d="M 865 237 L 1020 237" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 865 237 L 1020 237"/></circle></g><g class="connection response"><title>answer + results: customer → api</title><path class="flow" d="M 1020 266 L 865 266" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1020 266 L 865 266"/></circle></g><g class="connection request"><title>retrieve products: customer → retrieval</title><path class="flow" d="M 1110 297 L 1110 341 L 215 341 L 215 465" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1110 297 L 1110 341 L 215 341 L 215 465"/></circle></g><g class="connection request"><title>manage cart: customer → cart</title><path class="flow" d="M 1160 297 L 1160 365 L 700 365 L 700 465" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1160 297 L 1160 365 L 700 365 L 700 465"/></circle></g><g class="connection request"><title>recall / approved preferences: customer → memory</title><path class="flow" d="M 1185 297 L 1185 465" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1185 297 L 1185 465"/></circle></g><g class="connection request"><title>search / select: retrieval → search</title><path class="flow" d="M 215 585 L 215 644 L 192.5 644 L 192.5 771" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 215 585 L 215 644 L 192.5 644 L 192.5 771"/></circle></g><g class="connection write"><title>validate / transact: cart → sql</title><path class="flow" d="M 700 585 L 700 664 L 480.5 664 L 480.5 771" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 700 585 L 700 664 L 480.5 664 L 480.5 771"/></circle></g><g class="connection request"><title>read history / facts: memory → sql</title><path class="flow" d="M 1185 585 L 1185 632 L 580.5 632 L 580.5 771" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1185 585 L 1185 632 L 580.5 632 L 580.5 771"/></circle></g><g class="connection request"><title>read SQL facts: search → sql</title><path class="flow" d="M 335 811 L 388 811" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 335 811 L 388 811"/></circle></g><g class="connection response"><title>fresh SQL facts: sql → search</title><path class="flow" d="M 388 851 L 335 851" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 388 851 L 335 851"/></circle></g><g class="connection request"><title>product vector query: search → vectors</title><path class="flow" d="M 192.5 891 L 192.5 930 L 868.5 930 L 868.5 891" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 192.5 891 L 192.5 930 L 868.5 930 L 868.5 891"/></circle></g><g class="connection sync"><title>upsert / delete: indexing → vectors</title><path class="flow" d="M 1064 831 L 1011 831" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1064 831 L 1011 831"/></circle></g><g class="node" tabindex="0" role="button" aria-label="Storefront + AI sidebar" data-detail="Page context · recently viewed IDs Product cards · typed navigation"><title>Page context · recently viewed IDs Product cards · typed navigation</title><rect class="card" x="50" y="177" width="330" height="120" rx="15"/><rect x="68" y="195" width="3" height="15" rx="1" fill="#7dd3fc"/><