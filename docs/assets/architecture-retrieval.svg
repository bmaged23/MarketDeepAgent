<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="heading desc"><title id="heading">02 / Retrieval is an evidence loop</title><desc id="desc">Hybrid discovery and SQL selection feed batched approval, then a bounded coverage check.. Arrowheads show call, return and write directions. Motion is illustrative.</desc><defs><marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker><marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c4b5fd" stroke-width="2"/></marker><marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fbbf24" stroke-width="2"/></marker><marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5eead4" stroke-width="2"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#060e1c"/></linearGradient></defs><style>
text{font-family:system-ui,-apple-system,Arial,sans-serif}.heading{fill:#f0f6ff;font-size:30px;font-weight:700}.muted{fill:#94a9c4;font-size:13px}.lane{fill:#102039;fill-opacity:.55;stroke:#263d5b}.lane-title{fill:#d6e6fa;font-size:15px;font-weight:600;letter-spacing:1px}.card{fill:#14253d;stroke:#3a5575}.title{fill:#f0f6ff;font-size:19px;font-weight:650}.body{fill:#b4c6dd;font-size:13px}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px}.node:hover .card,.node:focus .card{stroke:#e2e8f0;stroke-width:2}.flow{fill:none;stroke-width:2;stroke-linejoin:round}.response .flow{stroke-dasharray:6 5}.sync .flow{stroke-dasharray:3 5}.edge-label{font-size:12px}@media(prefers-reduced-motion:reduce){.signal{display:none}}
</style><rect width="1400" height="1160" fill="url(#bg)"/><text class="heading" x="40" y="48">02 / Retrieval is an evidence loop</text><text class="muted" x="40" y="76">Hybrid discovery and SQL selection feed batched approval, then a bounded coverage check.</text><rect class="lane" x="24" y="105" width="1352" height="205" rx="22"/><text class="lane-title" x="48" y="136">PLAN</text><text class="muted" x="48" y="158">Ollama rewrites the request and chooses hybrid, SQL or both. Product output is schema validated.</text><rect class="lane" x="24" y="385" width="1352" height="325" rx="22"/><text class="lane-title" x="48" y="416">RETRIEVE</text><text class="muted" x="48" y="438">Parallel candidate sources for hybrid ranking; structured SQL is also an independent selection path.</text><rect class="lane" x="24" y="791" width="1352" height="287" rx="22"/><text class="lane-title" x="48" y="822">APPROVE → CHECK → RETURN</text><text class="muted" x="48" y="844">Only approved products enter the evidence pool. Runtime evidence stays in memory, grouped under its query.</text><g class="connection request"><title>request: request → rewrite</title><path class="flow" d="M 385 236 L 535 236" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 385 236 L 535 236"/></circle></g><g class="connection request"><title>validated plan: rewrite → tasks</title><path class="flow" d="M 870 236 L 1020 236" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 870 236 L 1020 236"/></circle></g><g class="connection request"><title>hybrid query: tasks → bm25</title><path class="flow" d="M 1090.5 296 L 1090 345 L 200 345 L 200 480" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1090.5 296 L 1090 345 L 200 345 L 200 480"/></circle></g><g class="connection sync"><title>embed + query: tasks → vector</title><path class="flow" d="M 1150.5 296 L 1150 365 L 545 365 L 545 480" stroke="#5eead4" marker-end="url(#sync)"/><circle class="signal" r="3.5" fill="#5eead4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1150.5 296 L 1150 365 L 545 365 L 545 480"/></circle></g><g class="connection write"><title>SQL task: tasks → sql</title><path class="flow" d="M 1210.5 296 L 1210 420 L 890 420 L 890 480" stroke="#fbbf24" marker-end="url(#write)"/><circle class="signal" r="3.5" fill="#fbbf24"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1210.5 296 L 1210 420 L 890 420 L 890 480"/></circle></g><g class="connection response"><title>lexical candidates: bm25 → fusion</title><path class="flow" d="M 200 600 L 200 636 L 1140 636 L 1140 600" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 200 600 L 200 636 L 1140 636 L 1140 600"/></circle></g><g class="connection response"><title>semantic candidates: vector → fusion</title><path class="flow" d="M 545 600 L 545 672 L 1200 672 L 1200 600" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 545 600 L 545 672 L 1200 672 L 1200 600"/></circle></g><g class="connection response"><title>SQL rows: sql → fusion</title><path class="flow" d="M 1040 520 L 1085 520" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1040 520 L 1085 520"/></circle></g><g class="connection request"><title>hydrate IDs: fusion → sql</title><path class="flow" d="M 1085 565 L 1040 565" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1085 565 L 1040 565"/></circle></g><g class="connection request"><title>retrieved chunks: fusion → judge</title><path class="flow" d="M 1280 600 L 1280 745 L 217.5 745 L 217.5 869" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 1280 600 L 1280 745 L 217.5 745 L 217.5 869"/></circle></g><g class="connection request"><title>approved pool: judge → coverage</title><path class="flow" d="M 385 929 L 535 929" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 385 929 L 535 929"/></circle></g><g class="connection response"><title>sufficient: coverage → output</title><path class="flow" d="M 870 929 L 1020 929" stroke="#c4b5fd" marker-end="url(#response)"/><circle class="signal" r="3.5" fill="#c4b5fd"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 870 929 L 1020 929"/></circle></g><g class="connection request"><title>missing → follow-up tasks: coverage → tasks</title><path class="flow" d="M 702.5 989 L 702.5 1110 L 1388 1110 L 1388 236 L 1355 236" stroke="#7dd3fc" marker-end="url(#request)"/><circle class="signal" r="3.5" fill="#7dd3fc"><animateMotion dur="3.5s" repeatCount="indefinite" path="M 702.5 989 L 702.5 1110 L 1388 1110 L 1388 236 L 1355 236"/></circle></g><g class="node" tabindex="0" role="button" aria-label="Customer request" data-detail="Product question + known context Expected facts / comparisons"><title>Product question + known context Expected facts / comparisons</title><rect class="card" x="50" y="176" width="335" height="120" rx="15"/><rect x="68" y="194" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="206" fill="#7dd3fc">INPUT</text><text class="title" x="68" y="234">Customer request</text><text class="body" x="68" y="258">Product question + known context</text><text class="body" x="68" y="276">Expected facts / comparisons</text></g><g class="node" tabindex="0" role="button" aria-label="Rewrite + split" data-detail="Queries · sources · filters · fields CatalogQuery / ProductEvidence schema"><title>Queries · sources · filters · fields CatalogQuery / ProductEvidence schema</title><rect class="card" x="535" y="176" width="335" height="120" rx="15"/><rect x="553" y="194" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="565" y="206" fill="#7dd3fc">OLLAMA</text><text class="title" x="553" y="234">Rewrite + split</text><text class="body" x="553" y="258">Queries · sources · filters · fields</text><text class="body" x="553" y="276">CatalogQuery / ProductEvidence schema</text></g><g class="node" tabindex="0" role="button" aria-label="Search task queue" data-detail="New subqueries + paginated selections Round / search / duplicate limits"><title>New subqueries + paginated selections Round / search / duplicate limits</title><rect class="card" x="1020" y="176" width="335" height="120" rx="15"/><rect x="1038" y="194" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="1050" y="206" fill="#7dd3fc">BOUNDED EXECUTION</text><text class="title" x="1038" y="234">Search task queue</text><text class="body" x="1038" y="258">New subqueries + paginated selections</text><text class="body" x="1038" y="276">Round / search / duplicate limits</text></g><g class="node" tabindex="0" role="button" aria-label="BM25 / SQLite FTS5" data-detail="Lexical candidates + SQL filters Names · descriptions · nutrition"><title>Lexical candidates + SQL filters Names · descriptions · nutrition</title><rect class="card" x="50" y="480" width="300" height="120" rx="15"/><rect x="68" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="510" fill="#7dd3fc">30% KEYWORD</text><text class="title" x="68" y="538">BM25 / SQLite FTS5</text><text class="body" x="68" y="562">Lexical candidates + SQL filters</text><text class="body" x="68" y="580">Names · descriptions · nutrition</text></g><g class="node" tabindex="0" role="button" aria-label="BGE → Qdrant query" data-detail="1024-d query · cosine candidates market_products + payload filters"><title>1024-d query · cosine candidates market_products + payload filters</title><rect class="card" x="395" y="480" width="300" height="120" rx="15"/><rect x="413" y="498" width="3" height="15" rx="1" fill="#5eead4"/><text class="tag" x="425" y="510" fill="#5eead4">70% SEMANTIC</text><text class="title" x="413" y="538">BGE → Qdrant query</text><text class="body" x="413" y="562">1024-d query · cosine candidates</text><text class="body" x="413" y="580">market_products + payload filters</text></g><g class="node" tabindex="0" role="button" aria-label="Structured SQL selection" data-detail="Selected fields · category / price filters All-match counts + pagination"><title>Selected fields · category / price filters All-match counts + pagination</title><rect class="card" x="740" y="480" width="300" height="120" rx="15"/><rect x="758" y="498" width="3" height="15" rx="1" fill="#fbbf24"/><text class="tag" x="770" y="510" fill="#fbbf24">SQL PATH</text><text class="title" x="758" y="538">Structured SQL selection</text><text class="body" x="758" y="562">Selected fields · category / price filters</text><text class="body" x="758" y="580">All-match counts + pagination</text></g><g class="node" tabindex="0" role="button" aria-label="Merge + hydrate" data-detail="Normalize → weighted sum Top-3 + fresh SQL product facts"><title>Normalize → weighted sum Top-3 + fresh SQL product facts</title><rect class="card" x="1085" y="480" width="270" height="120" rx="15"/><rect x="1103" y="498" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="1115" y="510" fill="#7dd3fc">HYBRID / SQL RESULTS</text><text class="title" x="1103" y="538">Merge + hydrate</text><text class="body" x="1103" y="562">Normalize → weighted sum</text><text class="body" x="1103" y="580">Top-3 + fresh SQL product facts</text></g><g class="node" tabindex="0" role="button" aria-label="Batch relevance approval" data-detail="Ollama returns approved chunk IDs Mapped to 0 / 1 for each chunk"><title>Ollama returns approved chunk IDs Mapped to 0 / 1 for each chunk</title><rect class="card" x="50" y="869" width="335" height="120" rx="15"/><rect x="68" y="887" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="80" y="899" fill="#7dd3fc">OLLAMA</text><text class="title" x="68" y="927">Batch relevance approval</text><text class="body" x="68" y="951">Ollama returns approved chunk IDs</text><text class="body" x="68" y="969">Mapped to 0 / 1 for each chunk</text></g><g class="node" tabindex="0" role="button" aria-label="Coverage validation" data-detail="Are the approved facts sufficient? Missing needs → new subqueries"><title>Are the approved facts sufficient? Missing needs → new subqueries</title><rect class="card" x="535" y="869" width="335" height="120" rx="15"/><rect x="553" y="887" width="3" height="15" rx="1" fill="#7dd3fc"/><text class="tag" x="565" y="899" fill="#7dd3fc">OLLAMA</text><text class="title" x="553" y="927">Coverage validation</text><text class="body" x="553" y="951">Are the approved facts sufficient?</text><text class="body" x="553" y="969">Missing needs → new subqueries</text></g><g class="node" tabindex="0" role="button" aria-label="Approved evidence groups" data-detail="Query / subquery + approved products Complete flag + trace / limitations"><title>Query / subquery + approved products Complete flag + trace / limitations</title><rect class="card" x="1020" y="869" width="335" height="120" rx="15"/><rect x="1038" y="887" width="3" height="15" rx="1" fill="#c4b5fd"/><text class="tag" x="1050" y="899" fill="#c4b5fd">RETURN TO CUSTOMER</text><text class="title" x="1038" y="927">Approved evidence groups</text><text class="body" x="1038" y="951">Query / subquery + approved products</text><text class="body" x="1038" y="969">Complete flag + trace / limitations</text></g><g><rect x="426.5" y="222" width="67" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="238" text-anchor="middle" fill="#7dd3fc">request</text></g><g><rect x="887.0" y="222" width="116" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="238" text-anchor="middle" fill="#7dd3fc">validated plan</text></g><g><rect x="309.0" y="332" width="102" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="360" y="348" text-anchor="middle" fill="#7dd3fc">hybrid query</text></g><g><rect x="600.5" y="352" width="109" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="655" y="368" text-anchor="middle" fill="#5eead4">embed + query</text></g><g><rect x="1053.0" y="407" width="74" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1090" y="423" text-anchor="middle" fill="#fbbf24">SQL task</text></g><g><rect x="373.0" y="623" width="144" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="445" y="639" text-anchor="middle" fill="#c4b5fd">lexical candidates</text></g><g><rect x="739.5" y="659" width="151" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="815" y="675" text-anchor="middle" fill="#c4b5fd">semantic candidates</text></g><g><rect x="705.0" y="732" width="130" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="770" y="748" text-anchor="middle" fill="#7dd3fc">retrieved chunks</text></g><g><rect x="405.5" y="917" width="109" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="460" y="933" text-anchor="middle" fill="#7dd3fc">approved pool</text></g><g><rect x="901.0" y="917" width="88" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="945" y="933" text-anchor="middle" fill="#c4b5fd">sufficient</text></g><g><rect x="993.5" y="1097" width="193" height="23" rx="7" fill="#0c1729"/><text class="edge-label" x="1090" y="1113" text-anchor="middle" fill="#7dd3fc">missing → follow-up tasks</text></g><text class="muted" x="40" y="1136">SOURCE-BACKED ARCHITECTURE  /  Motion illustrates direction; it is not runtime telemetry.</text></svg>