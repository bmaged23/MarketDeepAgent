<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق ذكاء | SmartCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="nav-row">
    <div class="brand-wrap">
      <div class="brand">سوق <span class="dot">ذكاء</span></div>
      <div class="brand-en">ZAKA MARKET</div>
    </div>
    <div class="nav-actions" style="display:flex; align-items:center; gap:14px;">
      <button class="cart-btn" title="السلة" onclick="openCart()">
        <span style="font-size:20px;">🛒</span>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </button>
      <div id="authArea"></div>
    </div>
  </div>
  <div class="hero">
    <h1>كل احتياجات بيتك، <span>بلمسة ذكاء</span></h1>
    <p>منتجات طازجة، أسعار عادلة، وتوصيل يفهم احتياجك</p>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج... مثلاً: شاي، أرز، تفاح">
      <span class="search-icon">🔍</span>
    </div>
  </div>
  <svg class="header-wave" viewBox="0 0 1200 40" preserveAspectRatio="none">
    <path d="M0,20 C150,40 350,0 600,15 C850,30 1050,5 1200,20 L1200,40 L0,40 Z"></path>
  </svg>
</header>

<main>
  <section>
    <div class="section-title">تسوّق حسب القسم</div>
    <div class="cat-grid" id="categories">
      <div class="loading">جارِ التحميل...</div>
    </div>
  </section>

  <section>
    <div class="section-title" id="products-title">كل المنتجات</div>
    <div class="prod-grid" id="products">
      <div class="loading">جارِ التحميل...</div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabRegister" onclick="switchTab('register')">حساب جديد</button>
      <button class="modal-tab" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
    </div>

    <form id="registerForm">
      <h2>انضم إلينا</h2>
      <p class="sub">أنشئ حسابك للبدء في التسوق</p>
      <div class="field"><label>الاسم الأول</label><input type="text" id="first_name" required></div>
      <div class="field"><label>الاسم الأخير</label><input type="text" id="last_name" required></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="password" required minlength="4"></div>
      <div class="field"><label>رقم الهاتف (اختياري)</label><input type="tel" id="phone"></div>
      <div class="field"><label>العنوان (اختياري)</label><input type="text" id="address"></div>
      <button type="submit" class="modal-submit">إنشاء الحساب</button>
      <div class="modal-msg" id="modalMsg"></div>
    </form>

    <form id="loginForm" style="display:none;">
      <h2>مرحباً بعودتك</h2>
      <p class="sub">سجّل الدخول لمتابعة التسوق</p>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="login_email" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="login_password" required></div>
      <button type="submit" class="modal-submit">تسجيل الدخول</button>
      <div class="modal-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-drawer">
    <button class="modal-close" onclick="closeCart()">×</button>
    <h2>سلة التسوق</h2>
    <div id="cartItemsWrap"></div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target === this) closeDetail()">
  <div class="detail-modal">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div id="detailContent" style="display:flex; width:100%;"></div>
  </div>
</div>

<div class="toast" id="toast">✓ تمت الإضافة إلى السلة</div>

<script src="js/app.js"></script>
</body>
</html>
